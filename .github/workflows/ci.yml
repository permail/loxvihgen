name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check lockfile
        run: uv lock --check

      - name: Sync environment
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy loxvihgen

      - name: Pytest
        run: uv run pytest -q
