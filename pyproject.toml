[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loxvihgen"
description = "Generate Loxone Virtual HTTP (VIH) templates from JSON/XML web-service responses"
dynamic = ["version"]
readme = "README.md"
license = "GPL-3.0-only"
keywords = ["loxone", "virtual input", "smart home", "xml", "json", "http"]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Home Automation",
  "Topic :: Utilities",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/permail/loxvihgen"
Repository = "https://github.com/permail/loxvihgen"
Issues = "https://github.com/permail/loxvihgen/issues"

[dependency-groups]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
loxvihgen = "loxvihgen.cli:main"

[tool.setuptools]
packages = ["loxvihgen"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "loxvihgen.__version__" }

[tool.setuptools.package-data]
loxvihgen = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["loxvihgen"]

[tool.coverage.run]
source = ["loxvihgen"]
